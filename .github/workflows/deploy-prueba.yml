name: Deploy prueba (psiconido.cl/prueba)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prueba
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La copia de prueba vive en una subcarpeta: SITE_BASE hace que todas las
      # rutas lleven el prefijo /prueba y que la página salga con noindex.
      - run: npm run build
        env:
          SITE_BASE: /prueba

      - name: Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 120000
          local-dir: ./dist/
          # Carpeta destino en el hosting. Si tu usuario FTP ya entra en public_html,
          # crea el secret FTP_DIR con el valor "prueba/".
          server-dir: ${{ secrets.FTP_DIR || 'prueba/' }}
