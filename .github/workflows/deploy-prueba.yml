name: Deploy prueba (psiconido.cl/prueba)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prueba
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La copia de prueba vive en una subcarpeta: SITE_BASE hace que todas las
      # rutas lleven el prefijo /prueba y que la página salga con noindex.
      - run: npm run build
        env:
          SITE_BASE: /prueba

      - name: Subir por FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'prueba/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://$FTP_SERVER
          mkdir -p $FTP_DIR
          mirror -R --delete --verbose dist/ $FTP_DIR
          bye
          EOF
